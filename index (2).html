<!DOCTYPE html>
<html>
    <body>
        <h2>CatPhotoApp</h2>
        <main>
            <h3>Cat Photos</h3>
            <p>Click here to view more cat photos!</p>
            <a href="https://freecatphotoapp.com" target="_blank">cat photos</a>
            <a href="https://freecatphotoapp.com" target="_blank"><img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg" alt="A cute orange cat lying on its back."></a>
            <h3>Things cats <em>love</em>:</h3>
            <ul>
                <li>catnip</li>
                <li>laser pointers</li>
                <li>nap time</li>
            </ul>
            <img src="sleepycat.jpg" alt="A cat napping.">
            <h4>Top 3 things cats <strong>hate</strong>:</h4>
            <ol>
                <li>flea treatment</li>
                <li>loud noises</li>
                <li>other cats</li>
            </ol>
            <img src="angrycat.jpg" alt="A cat looking annoyed.">
            <form action="/submit-cat-photo">
                <input type="radio" name="indoor-outdoor" id="indoor">
                <label for="indoor">indoor</label>
                <input type="radio" name="indoor-outdoor" id="outdoor">
                <label for="outdoor">outdoor</label>
                <input type="text" placeholder="cat photo URL" required>
                
                <button type="submit">Submit</button>
            </form>
        </main>
        
    </body>
</html>
